[package]
name = "orkestr-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
orkestr-domain.workspace = true
orkestr-inventory.workspace = true
orkestr-storage.workspace = true
orkestr-application.workspace = true
orkestr-protocol.workspace = true
orkestr-credentials.workspace = true
orkestr-library.workspace = true
orkestr-scheduler.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
zeroize.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
axum = "0.8"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
orkestr-client.workspace = true
tower = { version = "0.5", features = ["util"] }
reqwest.workspace = true
